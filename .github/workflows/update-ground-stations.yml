name: Update Ground Station AQI & Forecast (WAQI / CPCB)

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ground-stations
  cancel-in-progress: false

jobs:
  update-stations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch freshest active CPCB stations within 20km (WAQI)
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, math, os, urllib.request
          from datetime import datetime, timezone

          token = os.environ.get('WAQI_TOKEN', '').strip()
          if not token:
              raise SystemExit('WAQI_TOKEN secret is not set in GitHub Actions Secrets.')

          US_PM25_INV = [(0, 50, 0, 9.0), (51, 100, 9.1, 35.4), (101, 150, 35.5, 55.4), (151, 200, 55.5, 125.4), (201, 300, 125.5, 225.4), (301, 500, 225.5, 325.4)]
          US_PM10_INV = [(0, 50, 0, 54), (51, 100, 55, 154), (101, 150, 155, 254), (151, 200, 255, 354), (201, 300, 355, 424), (301, 500, 425, 604)]

          def inv_sub(idx, bps):
              if idx is None:
                  return None
              v = float(idx)
              for i_lo, i_hi, c_lo, c_hi in bps:
                  if v <= i_hi:
                      return round(((c_hi - c_lo) / max(1, i_hi - i_lo)) * (v - i_lo) + c_lo)
              last = bps[-1]
              return round(last[3] + ((v - last[1]) / 100.0) * 100.0)

          def haversine_km(lat1, lon1, lat2, lon2):
              r = 6371.0
              dlat = math.radians(lat2 - lat1)
              dlon = math.radians(lon2 - lon1)
              a = math.sin(dlat / 2) ** 2 + math.cos(math.radians(lat1)) * math.cos(math.radians(lat2)) * math.sin(dlon / 2) ** 2
              return 2 * r * math.asin(min(1.0, math.sqrt(a)))

          def fetch_json(url):
              with urllib.request.urlopen(url, timeout=15) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          def age_minutes(time_str):
              if not time_str:
                  return 99999
              try:
                  ts = time_str.replace('Z', '+00:00')
                  dt = datetime.fromisoformat(ts)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return max(0.0, (datetime.now(timezone.utc) - dt.astimezone(timezone.utc)).total_seconds() / 60.0)
              except Exception:
                  return 99999

          def fetch_freshest_station(lat, lon):
              # Search all stations within ~20 km bounding box
              d_lat = 0.18
              d_lon = 0.20
              bounds_url = f'https://api.waqi.info/map/bounds/?latlng={lat - d_lat:.4f},{lon - d_lon:.4f},{lat + d_lat:.4f},{lon + d_lon:.4f}&token={token}'
              candidates = []
              try:
                  b_payload = fetch_json(bounds_url)
                  if b_payload.get('status') == 'ok' and isinstance(b_payload.get('data'), list):
                      for st in b_payload['data']:
                          aqi_raw = st.get('aqi')
                          if aqi_raw in (None, '-', ''):
                              continue
                          try:
                              float(aqi_raw)
                          except Exception:
                              continue
                          s_lat, s_lon = st.get('lat'), st.get('lon')
                          uid = st.get('uid')
                          if s_lat is None or s_lon is None or uid is None:
                              continue
                          dist = haversine_km(lat, lon, float(s_lat), float(s_lon))
                          if dist <= 20.0:
                              st_time = (st.get('station') or {}).get('time') or ''
                              age = age_minutes(st_time)
                              # Prefer stations updated within the last 150 min (2.5h), then shortest distance
                              is_stale = 1 if age > 150 else 0
                              candidates.append((is_stale, dist, age, uid))
              except Exception:
                  pass

              candidates.sort(key=lambda x: (x[0], x[1], x[2]))
              # Try top 3 freshest/closest candidates for full feed
              for _, _, _, uid in candidates[:3]:
                  try:
                      feed = fetch_json(f'https://api.waqi.info/feed/@{uid}/?token={token}')
                      if feed.get('status') == 'ok' and feed.get('data') and isinstance(feed['data'].get('aqi'), (int, float)):
                          return feed['data']
                  except Exception:
                      continue

              # Fallback to direct geo lookup
              feed = fetch_json(f'https://api.waqi.info/feed/geo:{lat};{lon}/?token={token}')
              if feed.get('status') == 'ok' and feed.get('data'):
                  return feed['data']
              return None

          history = {}
          if os.path.exists('ground-stations.json'):
              try:
                  prev = json.load(open('ground-stations.json', 'r', encoding='utf-8'))
                  if isinstance(prev.get('history'), dict):
                      history = prev['history']
              except Exception:
                  history = {}

          cities = {
              'gurgaon':       (28.4595, 77.0266),
              'delhi':         (28.6139, 77.2090),
              'noida':         (28.5355, 77.3910),
              'greater_noida': (28.4744, 77.5040),
              'faridabad':     (28.4089, 77.3178),
              'ghaziabad':     (28.6692, 77.4538),
              'chandigarh':    (30.7333, 76.7794),
              'jaipur':        (26.9124, 75.7873),
              'lucknow':       (26.8467, 80.9462),
              'kanpur':        (26.4499, 80.3319),
              'agra':          (27.1767, 78.0081),
              'dehradun':      (30.3165, 78.0322),
              'amritsar':      (31.6340, 74.8723),
              'varanasi':      (25.3176, 82.9739),
              'patna':         (25.5941, 85.1376),
              'mumbai':        (19.0760, 72.8777),
              'pune':          (18.5204, 73.8567),
              'ahmedabad':     (23.0225, 72.5714),
              'surat':         (21.1702, 72.8311),
              'nagpur':        (21.1458, 79.0882),
              'bhopal':        (23.2599, 77.4126),
              'indore':        (22.7196, 75.8577),
              'bengaluru':     (12.9716, 77.5946),
              'hyderabad':     (17.3850, 78.4867),
              'chennai':       (13.0827, 80.2707),
              'kolkata':       (22.5726, 88.3639),
          }

          stations = {}
          for key, (lat, lon) in cities.items():
              try:
                  d = fetch_freshest_station(lat, lon)
                  if d and isinstance(d.get('aqi'), (int, float)):
                      iaqi = d.get('iaqi') or {}
                      stations[key] = {
                          'aqi': d.get('aqi'),
                          'time': d.get('time'),
                          'city': d.get('city'),
                          'dominentpol': d.get('dominentpol'),
                          'iaqi': iaqi,
                          'forecast': d.get('forecast'),
                      }
                      ts = (d.get('time') or {}).get('s') or ''
                      if ts:
                          city_hist = history.get(key, [])
                          if not city_hist or city_hist[-1].get('time') != ts:
                              city_hist.append({
                                  'time': ts,
                                  'usAqi': round(d['aqi']),
                                  'pm25': inv_sub((iaqi.get('pm25') or {}).get('v'), US_PM25_INV),
                                  'pm10': inv_sub((iaqi.get('pm10') or {}).get('v'), US_PM10_INV),
                                  'co': round((iaqi.get('co') or {}).get('v', 0) * 100) if 'co' in iaqi else None,
                                  'no2': round((iaqi.get('no2') or {}).get('v', 0)) if 'no2' in iaqi else None,
                                  'so2': round((iaqi.get('so2') or {}).get('v', 0)) if 'so2' in iaqi else None,
                                  'o3': round((iaqi.get('o3') or {}).get('v', 0)) if 'o3' in iaqi else None,
                              })
                              history[key] = city_hist[-96:]
              except Exception as exc:
                  print(f'Warning: failed to fetch {key}: {exc}')

          out = {
              'updated_utc': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'stations': stations,
              'history': history,
          }
          with open('ground-stations.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, indent=2)
          print(f'Saved {len(stations)} freshest WAQI stations + rolling history to ground-stations.json')
          EOF

      - name: Commit updated ground-stations.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add ground-stations.json
          git diff --staged --quiet || git commit -m "chore: update WAQI ground-station AQI & forecast snapshot"
          git push
